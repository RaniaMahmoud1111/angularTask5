<div class="container py-4" style="max-width: 560px">
  <h2 class="mb-4">Insert course</h2>

  @if (errorMessage) {
    <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="catSelect">Category</label>
      <select
        id="catSelect"
        class="form-select"
        name="catId"
        [(ngModel)]="course.catId"
        (ngModelChange)="onCategoryChange()"
        required
      >
        @for (cat of categories; track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="titleInp">Title</label>
      <input id="titleInp" type="text" class="form-control" name="title" [(ngModel)]="course.title" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="instructorInp">Instructor</label>
      <input id="instructorInp" type="text" class="form-control" name="instructor" [(ngModel)]="course.instructor" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="priceInp">Price</label>
      <input id="priceInp" type="number" class="form-control" name="price" [(ngModel)]="course.price" min="0" step="0.01" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="seatsInp">Seats</label>
      <input id="seatsInp" type="number" class="form-control" name="seats" [(ngModel)]="course.seats" min="0" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="imageInp">Image URL or path</label>
      <input id="imageInp" type="text" class="form-control" name="Image" [(ngModel)]="course.Image" />
    </div>

    <div class="mb-3">
      <label class="form-label" for="categoryNameInp">Category label (synced from dropdown)</label>
      <input id="categoryNameInp" type="text" class="form-control" name="category" [(ngModel)]="course.category" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Saving…' : 'Submit' }}
    </button>
  </form>
</div>
